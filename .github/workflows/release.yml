env:
  IS_MAIN_OR_RELEASE_BRANCH: ${{ startsWith(github.ref, 'refs/heads/release/') || github.ref_name == 'main' }}
  BRANCH_NAME: ${{ github.ref_name }}

name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'release/1.*'
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '*.md'
      - 'LICENSE'
      - 'build-and-deploy.ps1'

permissions:
  # 태그·GitHub Release 생성에 필요해서 명시(기본 토큰 권한에 기대지 않도록). 조직/저장소 정책이 상한을 적용해요.
  contents: write
  # 참고: 하단 "Trigger GitHub Pages rebuild" 단계도 이 GITHUB_TOKEN 을 씁니다 — 필요 스코프/정책 확인.

# 같은 ref 의 이전 런 취소(피드백 단축). 큐잉형이 낫으면 cancel-in-progress: false.
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build Greenshot with MSBuild
  # Upload installer to artifacts-installer
  # Upload build output to artifacts-greenshot-build
  build:
    name: Build Greenshot
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet packages 
      shell: cmd
      run: msbuild src/Greenshot.sln /p:Configuration=Release /restore /t:PrepareForBuild
      env:
        Box13_ClientId: ${{ secrets.Box13_ClientId }}
        Box13_ClientSecret: ${{ secrets.Box13_ClientSecret }}
        DropBox13_ClientId: ${{ secrets.DropBox13_ClientId }}
        DropBox13_ClientSecret: ${{ secrets.DropBox13_ClientSecret }}
        Flickr_ClientId: ${{ secrets.Flickr_ClientId }}
        Flickr_ClientSecret: ${{ secrets.Flickr_ClientSecret }}
        Imgur13_ClientId: ${{ secrets.Imgur13_ClientId }}
        Photobucket_ClientId: ${{ secrets.Photobucket_ClientId }}
        Photobucket_ClientSecret: ${{ secrets.Photobucket_ClientSecret }}
        Picasa_ClientId: ${{ secrets.Picasa_ClientId }}
        Picasa_ClientSecret: ${{ secrets.Picasa_ClientSecret }}

    - name: Build and package
      shell: cmd
      run: msbuild src/Greenshot.sln /p:Configuration=Release /t:Rebuild /v:normal
      env:
        Box13_ClientId: ${{ secrets.Box13_ClientId }}
        Box13_ClientSecret: ${{ secrets.Box13_ClientSecret }}
        DropBox13_ClientId: ${{ secrets.DropBox13_ClientId }}
        DropBox13_ClientSecret: ${{ secrets.DropBox13_ClientSecret }}
        Flickr_ClientId: ${{ secrets.Flickr_ClientId }}
        Flickr_ClientSecret: ${{ secrets.Flickr_ClientSecret }}
        Imgur13_ClientId: ${{ secrets.Imgur13_ClientId }}
        Photobucket_ClientId: ${{ secrets.Photobucket_ClientId }}
        Photobucket_ClientSecret: ${{ secrets.Photobucket_ClientSecret }}
        Picasa_ClientId: ${{ secrets.Picasa_ClientId }}
        Picasa_ClientSecret: ${{ secrets.Picasa_ClientSecret }}

    # The release tag, the installer file name and the in-app version all come from these two numbers, so they must
    # match: the updater compares the tag against WangShotInfo.Version of the installed copy
    - name: Check the 왕샷 version of the installer
      shell: pwsh
      run: |
        $app = (Select-String -Path src/Greenshot/Helpers/WangShotInfo.cs -Pattern 'Version = "([\d.]+)"').Matches[0].Groups[1].Value
        $setup = (Select-String -Path installer/wangshot.iss -Pattern '#define AppVersion "([\d.]+)"').Matches[0].Groups[1].Value
        Write-Host "왕샷 $app, installer $setup"
        if ($app -ne $setup) {
          throw "WangShotInfo.Version ($app) and installer/wangshot.iss AppVersion ($setup) differ."
        }

    # 왕샷 has its own installer (installer/wangshot.iss): its version is the 왕샷 version, the same one the About
    # window and the in-app updater use, not the Greenshot version the build gives the upstream installer
    - name: Build the 왕샷 installer
      shell: cmd
      run: |
        set "ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
        if not exist "%ISCC%" (
          echo Inno Setup 6 was not found on the runner, the installer can't be built.
          exit /b 1
        )
        "%ISCC%" /O"${{ github.workspace }}\artifacts-installer" installer\wangshot.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
       name: artifacts-installer
       path: ${{ github.workspace }}/artifacts-installer
       if-no-files-found: error

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-greenshot-build
        path: src/Greenshot/bin/Release/net480/**
        if-no-files-found: error

  pre_deploy:
    # Prepare for deployment
    # Determine version and release tag name
    name: Prepare for Deployment
    runs-on: ubuntu-latest
    needs: build
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      tag_name: ${{ env.IS_MAIN_OR_RELEASE_BRANCH == 'true' && format('v{0}', steps.version_info.outputs.version) || env.BRANCH_NAME }}
    steps: 

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: artifacts-installer # Name of the artifact uploaded in previous steps
          path: artifacts-installer # Local folder where artifacts are downloaded

      - name: Extract version from file name
        if: env.IS_MAIN_OR_RELEASE_BRANCH == 'true'
        id: version_from_filename
        run: |
          $file = Get-ChildItem artifacts-installer -Filter "WangShot-*-setup.exe" | Where-Object { $_.Name -notlike "WangShot-Light-*" } | Select-Object -First 1
          if (-not $file) {
            throw "No matching file found in 'artifacts-installer' directory."
          }
          if ($file.Name -match "^WangShot-([\d\.]+)-setup\.exe$") {
            echo "version=$($matches[1])" >> $Env:GITHUB_OUTPUT
          } else {
            throw "Version number could not be extracted from file name: $($file.Name)"
          }
        shell: pwsh

      - name: Set version from sanitized branch name
        if: env.IS_MAIN_OR_RELEASE_BRANCH != 'true'
        id: version_from_branchname
        run: |
          $branch = "${{ github.ref }}" -replace '^refs/heads/', ''
          $sanitized = $branch -replace '[^a-zA-Z0-9._-]', '_'
          echo "version=$sanitized" >> $Env:GITHUB_OUTPUT
        shell: pwsh

      - name: Set version info
        id: version_info
        run: |
          echo "version=${{ steps.version_from_filename.outputs.version || steps.version_from_branchname.outputs.version }}" >> $GITHUB_OUTPUT
        shell: bash

  portable:
    # Creates a portable app from the build output
    # Creates a ZIP archive and uploads it to artifacts-greenshot-portable
    name: Build Portable ZIP
    runs-on: ubuntu-latest
    needs: pre_deploy
    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: artifacts-greenshot-build
          path: artifacts-greenshot-build

      - name: Prepare portable folder
        run: |
          $buildArtifacts = "${{ github.workspace }}/artifacts-greenshot-build"
          $portableDir = "${{ github.workspace }}/portable"
          pwsh -File "${{ github.workspace }}/prepare-portable.ps1" -RepositoryRootPath ${{ github.workspace }} -BuildArtifactsPath $buildArtifacts -OutputPath $portableDir
        shell: pwsh

      - name: Create ZIP archive
        run: |
          $zipName = "WangShot-v${{ needs.pre_deploy.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "${{ github.workspace }}/portable/*" -DestinationPath $zipName -Force
        shell: pwsh
      
      - name: Upload portable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-greenshot-portable
          path: WangShot-*.zip
          if-no-files-found: error

  deploy:
    # Deploy the release
    # Creates a GitHub Release
    # Creates a version tag if release branch
    # Trigger GitHub Pages rebuild
    name: Deploy
    runs-on: ubuntu-latest
    needs: 
      - pre_deploy
      - portable      
    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: artifacts-installer
          path: artifacts-installer

      - name: Download portable artifacts
        uses: actions/download-artifact@v5
        with:
          name: artifacts-greenshot-portable
          path: artifacts-greenshot-portable

      - name: Create tag
        if: env.IS_MAIN_OR_RELEASE_BRANCH == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.pre_deploy.outputs.version }}" -m "v${{ needs.pre_deploy.outputs.version }}"
          git push origin "v${{ needs.pre_deploy.outputs.version }}"

      - name: Rename installer for non-release branch
        if: env.IS_MAIN_OR_RELEASE_BRANCH != 'true'
        run: |
          branch="${BRANCH_NAME:-${GITHUB_REF#refs/heads/}}"
          sanitized=$(echo "$branch" | sed 's/[^a-zA-Z0-9._-]/_/g')
          mv artifacts-installer/WangShot-*-setup.exe "artifacts-installer/WangShot-${sanitized}-setup.exe"
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "왕캡 ${{ needs.pre_deploy.outputs.version }}"
          tag_name: ${{ needs.pre_deploy.outputs.tag_name }}
          files: artifacts-installer/*.exe, artifacts-greenshot-portable/*.zip
          generate_release_notes: true
          draft: ${{ env.IS_MAIN_OR_RELEASE_BRANCH != 'true'  }}
          # 메인/릴리스 브랜치 빌드는 정식 릴리스로 표시돼요. 인앱 업데이터가 prerelease 는 건너뛰기 때문이에요.
          prerelease: ${{ env.IS_MAIN_OR_RELEASE_BRANCH != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger GitHub Pages rebuild
        shell: bash
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
